name: Deploy Portfolio Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-infrastructure-deployment
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_PAGER: ""
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STATE_BUCKET: rg-infrastructure-portfolio-tfstate-345471468677-eu-north-1

jobs:
  plan:
    name: Plan infrastructure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infra
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Authenticate with plan role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: PortfolioPlan-${{ github.run_id }}
          allowed-account-ids: "345471468677"

      - name: Initialise Terraform
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=infra/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Generate saved plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -out=infra.tfplan

          terraform show -no-color infra.tfplan > infra-plan.txt

      - name: Write plan summary
        run: |
          {
            echo "### Infrastructure plan"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo '```text'
            cat infra-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: infra-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            infra/infra.tfplan
            infra/infra-plan.txt
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply saved plan
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infra
        shell: bash

    steps:
      - name: Checkout planned commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Authenticate with apply role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: PortfolioApply-${{ github.run_id }}
          allowed-account-ids: "345471468677"

      - name: Initialise Terraform
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=infra/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: infra-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra

      - name: Apply saved plan
        run: |
          terraform apply \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            infra.tfplan

      - name: Write apply summary
        run: |
          {
            echo "### Infrastructure apply completed"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "Applied the saved plan generated by the plan job."
          } >> "$GITHUB_STEP_SUMMARY"